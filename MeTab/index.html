  <link rel="stylesheet"

  <link rel="stylesheet"

  <!-- ===== 背景提前加载初始化 ===== -->
  <script>
  (function () {
    var defaultBg = "image/MeTab-晴天.png";
    var backgroundUrl = defaultBg;
    var hasCustomBackground = false;

    try {
      // 检查是否存在自定义背景
      var config = JSON.parse(
        localStorage.getItem("metab_custom_background") || "null"
      );

      hasCustomBackground = !!config;

      // 优先读取上次保存的背景
      var savedBg = localStorage.getItem("preferredBackground");

      if (savedBg) {
        backgroundUrl = savedBg;
      }

    } catch (error) {
      console.warn("[MeTab] 背景设置读取失败：", error);
    }

    // 保存初始化结果，供后续 JS 使用
    window.__METAB_INITIAL_BACKGROUND_URL__ =
      hasCustomBackground ? "" : backgroundUrl;

    // 自定义背景由 custom-settings.js 负责加载
    if (hasCustomBackground) return;

    // 视频背景不使用图片预加载
    if (/\.(mp4|webm|ogg|mov|m4v)(?:$|[?#])/i.test(backgroundUrl)) {
      return;
    }

    // 提前请求图片背景
    var preload = document.createElement("link");

    preload.rel = "preload";
    preload.as = "image";
    preload.href = backgroundUrl;

    if ("fetchPriority" in preload) {
      preload.fetchPriority = "high";
    }

    document.head.appendChild(preload);

  })();
  </script>

</head>

<body>

  <!-- 背景 -->
  <video id="bg-video"
         autoplay
         loop
         muted
         playsinline
         webkit-playsinline
         preload="auto">
  </video>

  <img id="bg-image"
       alt="background">

  <!-- ===== 提前启动图片背景加载 ===== -->
  <script>
  (function () {
    var image = document.getElementById("bg-image");
    var backgroundUrl = window.__METAB_INITIAL_BACKGROUND_URL__;

    if (!image || !backgroundUrl) return;

    // 视频背景交给主 JS 加载
    if (/\.(mp4|webm|ogg|mov|m4v)(?:$|[?#])/i.test(backgroundUrl)) {
      return;
    }

    image.loading = "eager";
    image.style.display = "block";
    image.src = backgroundUrl;

  })();
  </script>

<button id="goBtn"
